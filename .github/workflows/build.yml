name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Condor2Nmea.sln -c Release
      - name: Test
        run: dotnet test tests/Condor2Nmea.Tests -c Release --no-build
      - name: Publish desktop app
        run: dotnet publish src/Condor2Nmea.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app
      - name: Publish command line tool
        run: dotnet publish src/Condor2Nmea.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/cli
      - uses: actions/upload-artifact@v4
        with:
          name: Condor2NMEA-win-x64
          path: |
            publish/app/Condor2NMEA.exe
            publish/cli/condor2nmea.exe
            README.md

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test (core + runtime)
        run: dotnet test tests/Condor2Nmea.Tests
